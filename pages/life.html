<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>All Photos | ROMA Lab</title>
    <meta name="description" content="All life photos from ROMA Lab."/>
    <link rel="icon" href="../assets/favicon.svg"/>
    <link rel="stylesheet" href="../css/styles.css"/>
    <style>
        header.simple {position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--border)}
        header.simple .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
        header.simple .brand{display:flex;align-items:center;gap:8px;font-weight:700}
        main{padding:32px 0}
        .filters-row{display:flex;gap:10px;flex-wrap:wrap}
        .filters-row select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text)}

        /* 关闭时彻底不渲染，避免撑高页面 */
        dialog.lightbox { display: none; padding: 0; border: 0; background: transparent; }

        /* 只有 [open] 时才显示，并用固定定位脱离文档流 */
        dialog.lightbox[open] {
            display: flex;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.6);
            z-index: 9999;
        }

        /* 图片最大化但不超出视口 */
        dialog.lightbox[open] img {
            max-width: 95vw;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            border-radius: 8px;
        }

        /* 可选：遮罩（如果你用到了 ::backdrop） */
        dialog.lightbox::backdrop { background: rgba(0,0,0,.25); }

    </style>
    <link rel="canonical" href="https://roma-ai-lab.github.io/pages/life.html"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="All Photos | ROMA Lab"/>
    <meta property="og:description" content="All life photos from ROMA Lab."/>
    <meta property="og:image" content="https://roma-ai-lab.github.io/assets/og-cover.jpg"/>
    <meta property="og:url" content="https://roma-ai-lab.github.io/pages/life.html"/>
    <meta name="twitter:card" content="summary_large_image"/>
</head>
<body data-page="life">
<!-- 轻量页头 -->
<header class="simple">
    <div class="container bar">
        <div class="left">
            <a class="brand" href="../index.html#home" aria-label="Back to home">
                <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M14 46 L32 18 L50 46 M24 46 L32 34 L40 46"
                          stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/>
                </svg>
                <span>ROMA Lab</span>
            </a>
            <span class="meta">All Photos</span>
        </div>
        <div class="right">
            <button id="theme-toggle" class="btn ghost" title="Toggle theme">🌓</button>
            <a class="btn" href="../index.html#life">Back to Home</a>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <div class="section-head">
            <div>
                <h2>All Photos</h2>
                <p class="section-desc">Snapshots from our lab life. Click any image to view larger.</p>
            </div>
            <div class="filters-row">
                <select id="life-year" aria-label="Filter by year">
                    <option value="">All years</option>
                </select>
                <select id="life-tag" aria-label="Filter by tag">
                    <option value="">All tags</option>
                </select>
            </div>
        </div>

        <div id="life-grid" class="grid research"></div>
        <!-- pages.js 会自动注入 dialog.lightbox 并处理预览 -->
    </div>
</main>

<!-- Footer -->
<footer role="contentinfo">
    <div class="container foot">
        <div class="foot-left">
            <svg aria-hidden="true" height="22" viewBox="0 0 64 64" width="22"><path d="M14 46 L32 18 L50 46 M24 46 L32 34 L40 46" fill="none" stroke="currentColor" stroke-linecap="round"
                                                                                     stroke-width="5"/></svg>
            <small>
                © <span id="year"></span> ROMA Lab. All rights reserved.
                备案号：<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2025495736号</a>

                <img src="/assets/beian.png" height="40" width="36" alt="ICP 备案标识"/>
                <a href="https://beian.mps.gov.cn/#/query/webSearch?code=44030002008688" rel="noreferrer" target="_blank">粤公网安备44030002008688号</a>
            </small>
        </div>
    </div>
    <button aria-label="Back to top" class="btn ghost hidden cta" id="to-top" title="Back to top">↑</button>
</footer>



<script src="pages.js"></script>
<script src="../js/pages-mediafx.js"></script>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
